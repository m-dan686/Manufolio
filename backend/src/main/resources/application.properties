# =====================================================================
# MANUFOLIO - SPRING BOOT APPLICATION CONFIGURATION (PRODUCTION READY)
# =====================================================================

# Server
server.port=${PORT:10000}

# MySQL / JDBC Datasource (Env variables for Production / Fallbacks for Local Dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manufolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ManufolioHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JPA Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# JWT Authentication
jwt.secret=${JWT_SECRET:manufolio-super-secret-key-2026-spring-boot-jwt-authentication-key}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://manufolio.vercel.app,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# Admin Initial Seed
admin.seed.username=${ADMIN_SEED_USERNAME:manu}
admin.seed.password=${ADMIN_SEED_PASSWORD:manu@123}

# Logging
logging.level.com.manufolio=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# Multipart / File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SMTP Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Notification Settings
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Manufolio}
app.mail.to=${MAIL_TO:}