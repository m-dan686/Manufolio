# =====================================================================
# MANUFOLIO - SPRING BOOT APPLICATION CONFIGURATION (PRODUCTION READY)
# =====================================================================

# Server
server.port=${PORT:8080}

# MySQL / JDBC Datasource (Env variables for Production / Fallbacks for Local Dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manufolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ManufolioHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JPA Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# JWT Authentication
jwt.secret=${JWT_SECRET:manufolio-super-secret-key-2026-spring-boot-jwt-authentication-key}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://manufolio.vercel.app,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# Admin Initial Seed
admin.seed.username=${ADMIN_SEED_USERNAME:manu}
admin.seed.password=${ADMIN_SEED_PASSWORD:manu@123}

# Logging
logging.level.com.manufolio=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# Multipart / File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Brevo Transactional Email REST API Configuration (HTTPS Port 443)
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:Manufolio}
brevo.to.email=${BREVO_TO_EMAIL:}